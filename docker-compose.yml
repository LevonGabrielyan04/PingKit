services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      # `network_mode` is not enabled for this container, so use the service name.
      REDIS_HOST: valkey
      REDIS_PORT: 6379
      DB_HOST: db
      DB_PORT: 3306
    depends_on:
      - valkey
      - db
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$s=@fsockopen(\"127.0.0.1\",9000); exit($$s ? 0 : 1);'"]
      interval: 10s
      timeout: 3s
      retries: 10
    stop_grace_period: 15s

    volumes:
      - laravel_storage:/var/www/html/storage
      - laravel_bootstrap_cache:/var/www/html/bootstrap/cache

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - app
    volumes:
      - laravel_storage:/var/www/html/storage

  masscan-worker:
    build:
      context: .
      dockerfile: docker/masscan-worker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # This container uses `network_mode: host`, so `127.0.0.1` is the host.
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
    # Host networking is required so masscan can send raw packets on the
    # host's network interfaces directly (no NAT layer).
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    depends_on:
      - valkey
      - db

  valkey:
    image: valkey/valkey:9.1.1-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data

  db:
    image: mariadb:12.3.2
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MARIADB_DATABASE: "${DB_DATABASE:-pingkit}"
      MARIADB_USER: "${DB_USERNAME:-laravel}"
      MARIADB_PASSWORD: "${DB_PASSWORD:-secret}"
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-rootsecret}"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  valkey_data:
  db_data:
  laravel_storage:
  laravel_bootstrap_cache:
